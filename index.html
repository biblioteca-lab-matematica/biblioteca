<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Biblioteca</title>
  
  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background-image: url("img/fundo.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  color: white;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: -1;
}
</style>
</head>
<body>

<h1>📚 Biblioteca Laboratório de Matemática</h1>

<input type="text" id="busca" placeholder="Buscar gênero...">

<ul id="lista"></ul>

<script>
const API = "https://opensheet.elk.sh/1a11o7S72keD_L8AMTgj0gQjHXwQGuLFtYkn_iiOD3c0/Sheet1";

let generos = [];

// carregar dados
fetch(API)
  .then(res => res.json())
  .then(livros => {

    // limpa e organiza os gêneros
    generos = [...new Set(
      livros
        .map(l => l.genero?.trim()) // remove espaços
        .filter(g => g)             // remove vazios
    )];

    mostrarLista(generos);
  })
  .catch(err => {
    console.error("Erro ao carregar dados:", err);
  });

// função para mostrar lista
function mostrarLista(listaGeneros) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  listaGeneros.forEach(genero => {
    const li = document.createElement("li");
    li.textContent = genero;

    li.onclick = () => {
      window.location.href =
        `genero.html?genero=${encodeURIComponent(genero)}`;
    };

    lista.appendChild(li);
  });
}

// busca em tempo real
function normalizarTexto(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

document.getElementById("busca").addEventListener("input", (e) => {
  const texto = normalizarTexto(e.target.value);

  const filtrados = livrosFiltrados.filter(l =>
    normalizarTexto(l.titulo).includes(texto) ||
    normalizarTexto(l.autor).includes(texto) ||
    normalizarTexto(l.etiqueta).includes(texto)
  );

  mostrarLivros(filtrados);
});
</script>

</body>
</html>
