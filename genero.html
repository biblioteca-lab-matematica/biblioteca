<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Livros</title>

  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background-image: url("img/fundo2.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  color: white;
}

/* camada escura */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 0;
}

/* conteúdo acima da camada */
body * {
  position: relative;
  z-index: 1;
}

/* melhora visual da lista */
ul {
  background: rgba(0,0,0,0.5);
  padding: 15px;
  border-radius: 10px;
  width: fit-content;
}

input {
  padding: 5px;
  margin-bottom: 10px;
}
</style>
</head>
<body>
<a id="voltar">⬅ Voltar</a>

<h1 id="titulo"></h1>

<input type="text" id="busca" placeholder="Buscar livro...">

<ul id="lista"></ul>

<script>
const API = "https://opensheet.elk.sh/1a11o7S72keD_L8AMTgj0gQjHXwQGuLFtYkn_iiOD3c0/Sheet1";

const params = new URLSearchParams(window.location.search);
const genero = params.get("genero");
const subgenero = params.get("subgenero");
  if (subgenero) {

  document.getElementById("voltar").href =
    `subgenero.html?genero=${encodeURIComponent(genero)}`;

} else {

  document.getElementById("voltar").href =
    `index.html`;
}

// título da página
document.getElementById("titulo").textContent =
  subgenero || genero;

// 

// lista original de livros do gênero
let livrosFiltrados = [];

// carregar dados
fetch(API)
  .then(res => res.json())
  .then(livros => {

    // filtra por gênero (com trim pra evitar erro)
 livrosFiltrados = livros.filter(l => {

  const generoOk =
    l.genero?.trim() === genero;

  const subgeneroOk =
    !subgenero ||
    l.subgenero?.trim() === subgenero?.trim();

  return generoOk && subgeneroOk;
});

    mostrarLivros(livrosFiltrados);
  })
  .catch(err => {
    console.error("Erro ao carregar dados:", err);
  });

// função para mostrar livros
function mostrarLivros(listaLivros) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  listaLivros.forEach(livro => {
    const li = document.createElement("li");

    li.textContent =
      `${livro.titulo} (${livro.autor})`; 

    li.onclick = () => {
    window.location.href =
      `detalhes.html?id=${livro.id}
&genero=${encodeURIComponent(genero)}
&subgenero=${encodeURIComponent(subgenero || "")}`;
    };

    lista.appendChild(li);
  });
}

// 🔍 busca em tempo real
function normalizarTexto(texto) {
  return (texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

document.getElementById("busca").addEventListener("input", (e) => {
  const texto = normalizarTexto(e.target.value);

  const filtrados = livrosFiltrados.filter(l =>
    normalizarTexto(l.titulo).includes(texto) ||
    normalizarTexto(l.autor).includes(texto) ||
    normalizarTexto(l.etiqueta).includes(texto)
  );

  mostrarLivros(filtrados);
});
</script>

</body>
</html>
