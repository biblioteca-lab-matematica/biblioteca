<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Detalhes</title>
  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background-image: url("img/fundo.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  color: white;
}
    h1 {
    font-size: 28px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

a {
    font-size: 18px;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: -1;
}
    @media (max-width: 600px) {

    body {
        font-size: 18px;
        padding: 18px;
    }

    h1 {
        font-size: 26px;
    }

    li {
        font-size: 20px;
        padding: 17px;
    }

    input {
        font-size: 18px;
        padding: 14px;
    }

    button {
        font-size: 19px;
        padding: 15px;
    }

}
</style>
</head>
<body>

<a id="voltar">⬅ Voltar</a>

<h1 id="titulo"></h1>
<img id="imagem" width="200">

<p><strong>Autor:</strong> <span id="autor"></span></p>
<p><strong>Ano:</strong> <span id="ano"></span></p>
<p><strong>Etiqueta:</strong> <span id="etiqueta"></span></p>

<script>
const API = "https://opensheet.elk.sh/1a11o7S72keD_L8AMTgj0gQjHXwQGuLFtYkn_iiOD3c0/Sheet1";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const genero = params.get("genero");
const subgenero = params.get("subgenero");

// botão voltar correto
if (subgenero) {

  document.getElementById("voltar").href =
    `genero.html?genero=${encodeURIComponent(genero)}
&subgenero=${encodeURIComponent(subgenero)}`;

} else {

  document.getElementById("voltar").href =
    `genero.html?genero=${encodeURIComponent(genero)}`;
}

fetch(API)
  .then(res => res.json())
  .then(livros => {

    const livro = livros.find(l =>
  String(l.id).trim() === String(id).trim()
);

    if (livro) {
      document.getElementById("titulo").textContent = livro.titulo;
      document.getElementById("autor").textContent = livro.autor;
      document.getElementById("ano").textContent = livro.ano;
      document.getElementById("etiqueta").textContent = livro.etiqueta;
      const imagem = document.getElementById("imagem"); 
        imagem.src = livro.imagem;
        imagem.onerror = () => {
        imagem.alt = "Imagem do livro indisponível";
        imagem.style.display = "none";
};
    }
  });
</script>

</body>
</html>
