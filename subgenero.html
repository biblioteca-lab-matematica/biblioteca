<!DOCTYPE html>
<html lang="pt-br">
<head>
   <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background-image: url("img/fundo.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  color: white;
}

/* camada escura */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 0;
}

/* conteúdo acima da camada */
body * {
  position: relative;
  z-index: 1;
}

/* melhora visual da lista */
ul {
  background: rgba(0,0,0,0.5);
  padding: 15px;
  border-radius: 10px;
  width: fit-content;
}

input {
  padding: 5px;
  margin-bottom: 10px;
}
</style>
<meta charset="UTF-8">
<title>Subgêneros</title>
</head>

<body>

<a href="voltar">⬅ Voltar</a>

<h1 id="titulo"></h1>

<ul id="lista"></ul>

<script>
const API = "https://opensheet.elk.sh/1a11o7S72keD_L8AMTgj0gQjHXwQGuLFtYkn_iiOD3c0/Sheet1";

const params = new URLSearchParams(window.location.search);
const genero = params.get("genero");
   document.getElementById("voltar").href =
  "index.html";

document.getElementById("titulo").textContent = genero;

fetch(API)
  .then(res => res.json())
  .then(livros => {

    const subgeneros = [...new Set(
      livros
        .filter(l => l.genero === genero)
        .map(l => l.subgenero)
        .filter(Boolean)
    )];

    const lista = document.getElementById("lista");

    subgeneros.forEach(sub => {

      const li = document.createElement("li");
      li.textContent = sub;

      li.onclick = () => {
        window.location.href =
          `genero.html?genero=${encodeURIComponent(genero)}&subgenero=${encodeURIComponent(sub)}`;
      };

      lista.appendChild(li);
    });

  });
</script>

</body>
</html>
