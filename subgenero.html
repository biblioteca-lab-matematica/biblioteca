<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Subgêneros</title>

  <style>
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;

      background-image: url("img/fundo.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      color: white;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }

    body * {
      position: relative;
      z-index: 1;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 400px;
    }

    li {
      background: rgba(255,255,255,0.1);
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    li:hover {
      background: rgba(255,255,255,0.25);
    }

    a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

<a id="voltar">⬅ Voltar</a>

<h1 id="titulo"></h1>

<ul id="lista"></ul>

<script>

const API =
  "https://opensheet.elk.sh/1a11o7S72keD_L8AMTgj0gQjHXwQGuLFtYkn_iiOD3c0/Sheet1";

const params = new URLSearchParams(window.location.search);

const genero = params.get("genero");

// botão voltar
document.getElementById("voltar").href = "index.html";

// título
document.getElementById("titulo").textContent = genero;

// carregar livros
fetch(API)
  .then(res => res.json())
  .then(livros => {

    // pega subgêneros únicos
    const subgeneros = [...new Set(

      livros
        .filter(l =>
          l.genero?.trim() === genero?.trim()
        )
        .map(l => l.subgenero?.trim())
        .filter(s => s)

    )];

    const lista = document.getElementById("lista");

    lista.innerHTML = "";

    subgeneros.forEach(sub => {

      const li = document.createElement("li");

      li.textContent = sub;

      li.onclick = () => {

        window.location.href =
          `genero.html?genero=${encodeURIComponent(genero)}&subgenero=${encodeURIComponent(sub)}`;
      };

      lista.appendChild(li);
    });

  })
  .catch(err => {
    console.error(err);
  });

</script>

</body>
</html>
