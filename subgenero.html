<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Subgêneros</title>
</head>

<body>

<a href="index.html">⬅ Voltar</a>

<h1 id="titulo"></h1>

<ul id="lista"></ul>

<script>
const API = "https://opensheet.elk.sh/1a11o7S72keD_L8AMTgj0gQjHXwQGuLFtYkn_iiOD3c0/Sheet1";

const params = new URLSearchParams(window.location.search);
const genero = params.get("genero");

document.getElementById("titulo").textContent = genero;

fetch(API)
  .then(res => res.json())
  .then(livros => {

    const subgeneros = [...new Set(
      livros
        .filter(l => l.genero === genero)
        .map(l => l.subgenero)
        .filter(Boolean)
    )];

    const lista = document.getElementById("lista");

    subgeneros.forEach(sub => {

      const li = document.createElement("li");
      li.textContent = sub;

      li.onclick = () => {
        window.location.href =
          `genero.html?genero=${encodeURIComponent(genero)}&subgenero=${encodeURIComponent(sub)}`;
      };

      lista.appendChild(li);
    });

  });
</script>

</body>
</html>
